<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Bulig: road help and local services wherever you travel. Checked emergency numbers, mechanics, tire repair, fuel and food." />
    <meta name="theme-color" content="#f4f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <!-- Installed to the home screen, Bulig opens full screen like an app, with no browser bar. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bulig" />
    <script>
      // The saved theme (Profile > Appearance), applied before the first paint. See src/theme.ts.
      try {
        var t = localStorage.getItem('bulig.theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t)
          var c = t === 'dark' ? '#09090b' : '#f4f7f5'
          document.querySelectorAll('meta[name=theme-color]').forEach(function (m) { m.setAttribute('content', c) })
        }
      } catch (e) {}

      // The splash shows once per launch, and never in front of Emergency: a link to /emergency
      // opens straight to it. Decided here, before the splash can paint.
      try {
        if (location.pathname.indexOf('/emergency') === 0 || sessionStorage.getItem('bulig.splash')) {
          document.documentElement.classList.add('no-splash')
        } else {
          sessionStorage.setItem('bulig.splash', '1')
          // src/splash.ts keeps the splash up for a moment from here.
          performance.mark('bulig-splash')
        }
      } catch (e) {}
    </script>
    <title>Bulig</title>
    <!-- The splash: painted with the HTML, before any script, so opening Bulig never shows a blank
         screen. src/splash.ts fades it out once the app has drawn. See docs/UI-UX.md, "Splash". -->
    <style>
      /* One colour in every theme (John, 2026-11-06): the same near-black as the manifest's
         background_color, which Android paints (with the icon) before this page even exists. A
         themed splash flashed white, then black, on a phone in dark mode; a manifest can only hold
         one colour, so the splash follows it, and fades into the app's own theme. */
      #splash {
        --splash-bg: #09090b;
        --splash-text: #fafafa;
        --splash-muted: #a1a1aa;
        --splash-brand: #22d3ee;
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: var(--splash-bg);
        color: var(--splash-text);
        font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        /* Fail-safe: if the app never starts, the splash still gets out of the way. */
        animation: splash-gone 0s 4s forwards;
      }
      .no-splash #splash {
        display: none;
      }
      /* The logo is inline (about 3 kB, no request): the pin drops onto the road and settles, its
         shadow grows under it, then the name and tagline rise in. CSS only, no animation library:
         nothing may load before the app (and 911) can. About 0.6 s, inside the splash's 0.7 s. */
      #splash .splash-mark {
        position: relative;
        display: grid;
        justify-items: center;
        margin-bottom: 4px;
      }
      #splash .splash-pin {
        width: 84px;
        height: 108px;
        color: var(--splash-brand);
        transform-origin: 50% 100%;
        animation: splash-drop 560ms cubic-bezier(0.23, 1, 0.32, 1) both;
      }
      #splash .splash-shadow {
        width: 44px;
        height: 8px;
        margin-top: 2px;
        border-radius: 50%;
        background: var(--splash-text);
        opacity: 0.12;
        animation: splash-shadow 560ms cubic-bezier(0.23, 1, 0.32, 1) both;
      }
      #splash p {
        margin: 0;
        animation: splash-in 360ms cubic-bezier(0.23, 1, 0.32, 1) both;
      }
      #splash .splash-name {
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        animation-delay: 220ms;
      }
      #splash .splash-tagline {
        color: var(--splash-muted);
        font-size: 1rem;
        animation-delay: 280ms;
      }
      #splash.splash-out {
        pointer-events: none;
        animation: splash-out 320ms cubic-bezier(0.23, 1, 0.32, 1) forwards;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      @keyframes splash-drop {
        from {
          opacity: 0;
          transform: translateY(-36px);
        }
        55% {
          opacity: 1;
          transform: translateY(0) scale(1.04, 0.94);
        }
        to {
          transform: none;
        }
      }
      @keyframes splash-shadow {
        from {
          opacity: 0;
          transform: scaleX(0.3);
        }
        55% {
          opacity: 0.14;
          transform: scaleX(1.08);
        }
      }
      /* The logo lifts away a touch as the splash fades, so the app comes up from under it. */
      @keyframes splash-out {
        to {
          opacity: 0;
        }
      }
      #splash.splash-out .splash-mark,
      #splash.splash-out p {
        transition:
          transform 320ms cubic-bezier(0.23, 1, 0.32, 1),
          opacity 240ms cubic-bezier(0.23, 1, 0.32, 1);
        transform: translateY(-8px) scale(0.98);
        opacity: 0;
      }
      @keyframes splash-gone {
        to {
          visibility: hidden;
          pointer-events: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash-pin,
        #splash .splash-shadow,
        #splash p {
          animation-name: splash-fade;
        }
        @keyframes splash-fade {
          from {
            opacity: 0;
          }
        }
      }
    </style>
  </head>
  <body>

        <span class="splash-shadow"></span>
      </div>
      <p class="splash-name">Bulig</p>

    </div>
