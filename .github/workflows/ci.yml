name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
      # The production build talks to the API (app/.env.production), so it must not ship the
      # phone-only test logins or their password.
      - name: No test logins in the production bundle
        run: |
          if grep -rlE 'test@bulig\.com|moderator@bulig\.com|admin@bulig\.com' dist/; then
            echo "::error::Test logins ended up in the production bundle (see src/auth/appAccounts.ts)."
            exit 1
          fi
